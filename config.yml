
baseurl: "https://parsiya.github.io/parsiya.fa/"
title: "امنیت و غیره به فارسی"
theme: Hugo-Octopress
defaultContentLanguage: fa
pagination:
  pagerSize: 10
# summaryLength: 0
copyright: تحت مجوز [کریتیو کامنز اختیار-غیرتجاری 4.0 بین‌المللی](https://creativecommons.org/licenses/by-nc/4.0/)

permalinks:
  posts: '/:year/:month/:title/'
  page: '/:slug/'

# menu:
#   sidebar:
#     - name: Link 1
#       url: 'https://example.com'
#     - name: Link 2
#       url: 'https://example.org'

params:
  author: پارسیا
  mainSections: [post]
  compactIndex: true
  disableGoogleFonts: true
  rss: true
  sidebarRecentLimit: 5
  github: "https://github.com/parsiya/parsiya.fa"
 
  homeInfoParams:
    Title: امنیت و غیره به فارسی
    # Content: ا

  socialIcons: # optional
    - name: "github"
      url: "https://github.com/parsiya/parsiya.fa"
    - name: "website"
      url: "https://parsiya.net"
  
  ShowBreadCrumbs: true
  comments: false
  defaultTheme: dark
  
  cover:
    hiddenInList: true # uncomment to disable the post cover image in the index
    # hiddenInSingle: true

languages:
  fa:
    locale: fa-IR
    label: فارسی
    direction: rtl
    weight: 1

menus:
  main:
    - name: خانه
      pageRef: /

markup:
  goldmark:
    extensions:
      typographer: false
    parser:
    renderer:
      hardWraps: false
      unsafe: true

outputs:
    home:
        - HTML
        - RSS